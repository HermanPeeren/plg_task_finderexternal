PLG_TASK_FINDEREXTERNAL="Task - Smart Search External Sites"
PLG_TASK_FINDEREXTERNAL_XML_DESCRIPTION="Crawls other websites and adds their pages to this site's Smart Search index, with their own addresses: search results link straight to the other site. Reads sitemaps, feeds and links, keeps no copy of the pages, and works in portions within a time budget per run."

PLG_TASK_FINDEREXTERNAL_INDEX_TITLE="Smart Search: index external site"
PLG_TASK_FINDEREXTERNAL_INDEX_DESC="Reads another website (one site per task) and adds its pages to the Smart Search index with their own addresses. Each run does a portion within its time budget and goes on where the previous run stopped; unchanged pages are skipped."

PLG_TASK_FINDEREXTERNAL_FIELD_SITE_LABEL_LABEL="Site label"
PLG_TASK_FINDEREXTERNAL_FIELD_SITE_LABEL_DESC="The name of the site in search results and in the Type search filter, such as \"Documentation\" or \"Blog\"."

PLG_TASK_FINDEREXTERNAL_NOTE_SOURCES_LABEL="Where the pages are found"
PLG_TASK_FINDEREXTERNAL_NOTE_SOURCES_DESC="Give at least one sitemap, feed or start page, one address per line. Only the hosts of these addresses are ever visited."
PLG_TASK_FINDEREXTERNAL_FIELD_SITEMAPS_LABEL="Sitemaps"
PLG_TASK_FINDEREXTERNAL_FIELD_SITEMAPS_DESC="XML sitemaps or sitemap indexes, such as https://www.example.org/sitemap.xml. Pages that disappear from the sitemap are removed from the index."
PLG_TASK_FINDEREXTERNAL_FIELD_FEEDS_LABEL="Feeds"
PLG_TASK_FINDEREXTERNAL_FIELD_FEEDS_DESC="RSS or Atom feeds, such as https://www.example.org/blog?format=feed&amp;type=rss. Read every cycle, so new items are found quickly."
PLG_TASK_FINDEREXTERNAL_FIELD_START_URLS_LABEL="Start pages"
PLG_TASK_FINDEREXTERNAL_FIELD_START_URLS_DESC="Pages whose links are followed, such as the home page. Read every cycle. Set \"Link depth\" to how many links deep to go."
PLG_TASK_FINDEREXTERNAL_FIELD_MAX_DEPTH_LABEL="Link depth"
PLG_TASK_FINDEREXTERNAL_FIELD_MAX_DEPTH_DESC="How many links deep to follow from a start page. 0: follow no links, only use the sitemaps and feeds. Pages from a sitemap or feed count as depth 1."

PLG_TASK_FINDEREXTERNAL_NOTE_URLS_LABEL="Which pages"
PLG_TASK_FINDEREXTERNAL_NOTE_URLS_DESC="Regular expressions, one per line, matched against the whole address, case-insensitive. Example: ^https://www\.example\.org/docs/ . Lines starting with // are comments."
PLG_TASK_FINDEREXTERNAL_FIELD_SCOPE_LABEL="Visit only"
PLG_TASK_FINDEREXTERNAL_FIELD_SCOPE_DESC="When filled in, only addresses matching one of these are visited. Empty: every address on the site's hosts."
PLG_TASK_FINDEREXTERNAL_FIELD_EXCLUDE_LABEL="Never visit"
PLG_TASK_FINDEREXTERNAL_FIELD_EXCLUDE_DESC="Addresses matching one of these are never visited, such as old versions, print views, feeds, login and search pages."
PLG_TASK_FINDEREXTERNAL_FIELD_INDEX_ONLY_LABEL="Index only"
PLG_TASK_FINDEREXTERNAL_FIELD_INDEX_ONLY_DESC="When filled in, only visited pages matching one of these are indexed; the others are only read for their links (overviews, issue pages, pagination). Empty: every visited page with content."

PLG_TASK_FINDEREXTERNAL_NOTE_CONTENT_LABEL="What is read from a page"
PLG_TASK_FINDEREXTERNAL_NOTE_CONTENT_DESC="CSS selectors: tag, .class, #id, [attribute], [attribute=value], a space for \"inside\", &gt; for \"directly inside\", and commas for alternatives."
PLG_TASK_FINDEREXTERNAL_FIELD_CONTENT_SELECTOR_LABEL="Content"
PLG_TASK_FINDEREXTERNAL_FIELD_CONTENT_SELECTOR_DESC="The main text of a page, such as main, article or .article-body. Pages where this finds no text are not indexed."
PLG_TASK_FINDEREXTERNAL_FIELD_TITLE_SELECTOR_LABEL="Title"
PLG_TASK_FINDEREXTERNAL_FIELD_TITLE_SELECTOR_DESC="The page title. When it finds nothing, og:title and then the title element are used."
PLG_TASK_FINDEREXTERNAL_FIELD_REMOVE_SELECTORS_LABEL="Leave out"
PLG_TASK_FINDEREXTERNAL_FIELD_REMOVE_SELECTORS_DESC="Parts of the content that are not text to search, one selector per line, such as table-of-contents boxes, \"edit this page\" links or share buttons."
PLG_TASK_FINDEREXTERNAL_FIELD_DESCRIPTION_SOURCE_LABEL="Description"
PLG_TASK_FINDEREXTERNAL_FIELD_DESCRIPTION_SOURCE_DESC="The short text under a search result."
PLG_TASK_FINDEREXTERNAL_FIELD_DESCRIPTION_SOURCE_META="Meta description, else first paragraph"
PLG_TASK_FINDEREXTERNAL_FIELD_DESCRIPTION_SOURCE_CONTENT="First paragraph, else meta description"
PLG_TASK_FINDEREXTERNAL_FIELD_DATE_SELECTOR_LABEL="Date"
PLG_TASK_FINDEREXTERNAL_FIELD_DATE_SELECTOR_DESC="An element with the publication date, such as time; its datetime attribute is used when it has one. Empty: the article:published_time meta tag, if any."
PLG_TASK_FINDEREXTERNAL_FIELD_AUTHOR_SELECTOR_LABEL="Author"
PLG_TASK_FINDEREXTERNAL_FIELD_AUTHOR_SELECTOR_DESC="An element with the author's name. Empty: the author meta tag, if any. Shown as the Author search filter."
PLG_TASK_FINDEREXTERNAL_FIELD_CATEGORY_SELECTOR_LABEL="Category"
PLG_TASK_FINDEREXTERNAL_FIELD_CATEGORY_SELECTOR_DESC="Elements naming the page's section, such as breadcrumb links; the last one is used. Shown as the Category search filter."

PLG_TASK_FINDEREXTERNAL_NOTE_INDEX_LABEL="In the index"
PLG_TASK_FINDEREXTERNAL_FIELD_LANGUAGE_LABEL="Language"
PLG_TASK_FINDEREXTERNAL_FIELD_LANGUAGE_DESC="The language of the site's pages. On a multilingual site, results only show for that language; All shows them everywhere."
PLG_TASK_FINDEREXTERNAL_FIELD_ACCESS_LABEL="Access"
PLG_TASK_FINDEREXTERNAL_FIELD_ACCESS_DESC="Who sees these results. The pages are public on their own site, so this is normally Public."

PLG_TASK_FINDEREXTERNAL_NOTE_CRAWL_LABEL="Crawling"
PLG_TASK_FINDEREXTERNAL_FIELD_RECHECK_DAYS_LABEL="Check pages again after (days)"
PLG_TASK_FINDEREXTERNAL_FIELD_RECHECK_DAYS_DESC="A page that was checked is fetched again after this many days, to find changes. Start pages, sitemaps and feeds are read every cycle. 0: check every page every cycle."
PLG_TASK_FINDEREXTERNAL_FIELD_REQUEST_DELAY_LABEL="Pause between requests (ms)"
PLG_TASK_FINDEREXTERNAL_FIELD_REQUEST_DELAY_DESC="Milliseconds to wait between two requests to the other site, to keep its load low."
PLG_TASK_FINDEREXTERNAL_FIELD_RESPECT_ROBOTS_LABEL="Follow robots.txt"
PLG_TASK_FINDEREXTERNAL_FIELD_RESPECT_ROBOTS_DESC="Do not visit pages that the site's robots.txt disallows, and leave out pages with a noindex robots meta tag."
PLG_TASK_FINDEREXTERNAL_FIELD_USER_AGENT_LABEL="User agent"
PLG_TASK_FINDEREXTERNAL_FIELD_USER_AGENT_DESC="How the crawler introduces itself to the other site. Empty: JoomlaSmartSearchExternal/1.0 with the address of this site."
PLG_TASK_FINDEREXTERNAL_FIELD_TIME_BUDGET_LABEL="Time per run (seconds)"
PLG_TASK_FINDEREXTERNAL_FIELD_TIME_BUDGET_DESC="How long one run may work. A task can run from a visitor's page view (lazy scheduler) or Run Test, so keep this well under the server's time limit. When work is left, the scheduler runs the task again on its next tick."

PLG_TASK_FINDEREXTERNAL_LOG_NOT_CONFIGURED="The task is not set up correctly: %s"
PLG_TASK_FINDEREXTERNAL_LOG_FAILED="The run stopped with an error: %s"
